[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tamperlint"
dynamic = ["version"]
description = "Explainable tamper detection for PDFs and scanned documents: structure, content-stream, geometry, image and content-logic checks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Tamperlint contributors" }]
keywords = [
  "document-forensics", "pdf", "tamper-detection", "fraud-detection",
  "document-intelligence", "forgery-detection", "sarif", "linter",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Office/Business :: Financial",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = [
  "pikepdf>=10.0",
  "pdfplumber>=0.11",
  "pypdfium2>=5.0",
  "pyhanko>=0.30",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "Pillow>=11.0",
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
demo = ["gradio>=5.0"]
synth = ["reportlab>=4.2", "faker>=30.0"]
dev = [
  "tamperlint[server,synth]",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
tamperlint = "tamperlint.cli:app"

[project.urls]
Homepage = "https://github.com/muneeb9211/tamperlint"
Documentation = "https://github.com/muneeb9211/tamperlint/tree/main/docs"
Issues = "https://github.com/muneeb9211/tamperlint/issues"

[tool.hatch.version]
path = "src/tamperlint/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tamperlint"]

[tool.hatch.build.targets.sdist]
include = ["/src/tamperlint", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = [
  "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915",
  "PLC0415",  # optional dependencies (pyHanko signing, cryptography) are imported lazily
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["tamperlint"]

[[tool.mypy.overrides]]
module = [
  "pikepdf.*", "pdfplumber.*", "pdfminer.*", "pypdfium2.*", "pyhanko.*", "pyhanko_certvalidator.*",
  "asn1crypto.*", "cv2.*", "reportlab.*", "faker.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The synthetic-data generators drive pyHanko's untyped writer API.
module = ["tamperlint.synth.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that build larger corpora"]
